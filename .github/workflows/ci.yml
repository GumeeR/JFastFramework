name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The rate limiter's token bucket is a Lua script, and the websocket
    # fan-out crosses a pub/sub backplane. Neither can be proven against a
    # test double: a double cannot show that Redis runs the script to
    # completion with nothing interleaved, and it cannot show that a
    # message reaches the one worker holding the socket. Both suites skip
    # themselves without this, which is how a concurrency guarantee ends up
    # shipped and never observed.
    services:
      # The read/write split's whole correctness claim is that a read
      # following a write does not land on a lagging replica. That cannot
      # be shown against SQLite, and the suite skips without a server.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jfast
          POSTGRES_PASSWORD: jfast
          POSTGRES_DB: jfast
        ports:
          - 5499:5432
        options: >-
          --health-cmd "pg_isready -U jfast"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        # Without the health check the first test can race the container's
        # startup and fail on a connection refused that looks like a bug in
        # the code under test.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # setuptools is upgraded first. It is not a dependency of this
        # package -- hatchling does the building -- but setup-python ships one
        # in the runner's environment, pip-audit sees it, and the version it
        # ships has lagged behind published advisories. Upgrading is the honest
        # fix; waiving a real advisory because it is inconvenient is not.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,dev]"

      # `services:` starts a server, it does not run SQL. The suite treats
      # these four as a lagging primary/replica pair plus two tenants.
      - name: Databases the split and tenancy suites expect
        env:
          PGPASSWORD: jfast
        run: |
          for db in primarydb replicadb tenant_a tenant_b; do
            psql -h localhost -p 5499 -U jfast -d jfast -c "CREATE DATABASE $db"
          done

      - name: Lint
        run: ruff check src tests

      - name: Format
        run: ruff format --check src tests

      - name: Types
        run: mypy src

      - name: Tests
        # The URL is what un-skips the two suites above. A test that skips
        # in CI and passes locally is a test nobody is running.
        env:
          JFAST_TEST_REDIS_URL: redis://localhost:6379/0
          JFAST_TEST_PG_URL: postgresql+asyncpg://jfast:jfast@localhost:5499
        run: pytest -q

      # Named, because a skip is silent and this is the whole point of the
      # service container above.
      # Named, because a skip is silent and these three are the only
      # evidence that the atomicity, the fan-out and the pinning are real.
      - name: Prove the tests needing a real server actually ran
        env:
          JFAST_TEST_REDIS_URL: redis://localhost:6379/0
          JFAST_TEST_PG_URL: postgresql+asyncpg://jfast:jfast@localhost:5499
        run: |
          pytest -q -rs --no-header \
            tests/test_ratelimit.py::test_lua_script_against_real_redis \
            tests/test_websocket.py::test_a_message_published_on_one_worker_reaches_a_socket_on_the_other \
            tests/test_database_postgres.py \
            | tee /tmp/server-tests.log
          if grep -qE '^SKIPPED|no tests ran' /tmp/server-tests.log; then
            echo '::error::a test needing a real server skipped; a service container is not reachable'
            exit 1
          fi

      # A framework shipping opinionated auth and storage defaults should audit
      # its own dependency tree. Both are hard gates.
      #
      # When a finding lands on an unrelated pull request, the order is: try
      # upgrading the package first, and only if it cannot be upgraded, waive
      # it here explicitly -- `pip-audit --ignore-vuln PYSEC-0000-000` with a
      # comment saying which code path makes it inapplicable. Same for bandit
      # with `# nosec BXXX` and the reason on the line above. What must not
      # happen is a step going yellow and being ignored, which is how a
      # security check stops meaning anything.
      - name: Audit dependencies
        # --skip-editable: this project is installed from the checkout and is
        # not on PyPI, so there is nothing to look up for it.
        run: pip-audit --skip-editable --desc

      - name: Static security scan
        run: bandit -c pyproject.toml -r src -ll

      # The generator is the part most likely to break silently: templates
      # render fine but produce code that does not import, or a Jinja
      # environment eats the runtime braces a Vue file needs. Both smoke
      # scripts render real trees and run what they produce.
      - name: Scaffold smoke
        run: bash scripts/smoke.sh

      - name: Contracts smoke
        run: bash scripts/smoke_contracts.sh

      - name: Auth and Kubernetes smoke
        run: bash scripts/smoke_auth_k8s.sh

      - name: Storage, tenancy and serverless smoke
        run: bash scripts/smoke_storage_tenancy.sh

      - name: Workspace smoke
        run: bash scripts/smoke_workspace.sh

      - name: Quickstart smoke
        # The documented commands, run exactly as documented. Docs that have
        # never been executed are a guess.
        run: bash scripts/smoke_docs.sh

      - name: Docs site builds and validates
        run: |
          pip install -e ".[docs]"
          python docs-site/build.py --version ci --output site/ci
          python docs-site/check.py site/ci

  # Generated projects in other languages get their own job, because the
  # point of generating them is that they build. A scaffold nobody has run
  # is a liability that looks like a feature.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: pip install -e ".[all,dev]"
      - name: Generate, vet, test, build and run a Go service
        run: bash scripts/smoke_go.sh

  # The image the generator writes, built and run against a real PostgreSQL.
  # Its own job because it needs Docker and a few minutes, and because four
  # shipped defects lived in exactly this gap: every other check installs the
  # framework from the checkout with all extras and never builds an image.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all,dev]"
      - name: Build and run the generated image
        run: bash scripts/smoke_docker.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[all,dev]"
      - name: Generate, install and build the Vue and React frontends
        run: bash scripts/smoke_frontend.sh
